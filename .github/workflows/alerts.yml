name: Infra alert mailer

# 경고 메일(10분마다) + 일일 요약(매일 09:00 KST) 을 클라우드에서 실행한다.
# 운영자 PC 를 켜 둘 필요가 없다.
# 자격증명/수신자는 저장소 Secrets 로 주입한다(코드·로그·공개 저장소에 노출 안 됨):
#   ALERT_GMAIL_USER         : 봇 Gmail 주소
#   ALERT_GMAIL_APP_PASSWORD : Gmail 앱 비밀번호 16자리
#   ALERT_TO                 : 수신자 이메일(콤마로 구분)

on:
  schedule:
    - cron: "*/10 * * * *"   # 경고 체크 (UTC 기준; GitHub 사정상 수 분 지연·일부 누락 가능)
    - cron: "0 0 * * *"      # 일일 요약: 00:00 UTC = 09:00 KST
  workflow_dispatch: {}       # 수동 실행 버튼(테스트용)

permissions:
  contents: read

concurrency:
  group: infra-alert-mailer
  cancel-in-progress: false

jobs:
  mailer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 중복 방지(alert_seen) / 이력(alert_history) 상태를 실행 간에 유지한다.
      # (러너 파일시스템은 매번 초기화되므로 캐시로 이전 상태를 가져오고 다시 저장)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            alert_seen.json
            alert_history.jsonl
          key: infra-alert-state-${{ github.run_id }}
          restore-keys: |
            infra-alert-state-

      - name: Run mailer
        env:
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            python alert_mailer.py --daily     # 일일 요약
          else
            python alert_mailer.py             # 경고 체크(1회)
          fi

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            alert_seen.json
            alert_history.jsonl
          key: infra-alert-state-${{ github.run_id }}
